name = "personal-media-log"
compatibility_date = "2024-12-18"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "MEDIA_LOG_DB"
database_name = "personal-media-log-db"
database_id = "c3e04583-2deb-47e3-8c4f-314479cec3c9"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA_LOG_BACKUPS"
bucket_name = "personal-media-log-backups"

[vars]
ACCESS_ALLOWED_EMAILS = ""
BACKUP_ENCRYPTION_KEY_B64 = ""

# Cron triggers are not supported in Cloudflare Pages config.
# Scheduled backup should be implemented as a separate Worker later.
# [triggers]
# crons = ["17 19 * * *"]